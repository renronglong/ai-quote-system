# ============================================
# 铝型材图纸解析器 Docker Compose
# 一键启动：docker-compose up -d
# ============================================

version: "3.8"

services:
  drawing-parser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drawing-parser
    restart: unless-stopped
    
    ports:
      - "8000:8000"
    
    volumes:
      # 持久化数据目录
      - parser_data:/app/data
      - parser_output:/app/output
    
    environment:
      - FREECAD_CMD=freecadcmd
      - ODA_PATH=/usr/bin/ODAFileConverter
      - XVFB_DISPLAY=:99
      - AL_DENSITY=2700.0
      - PORT=8000
      - PYTHONPATH=/app
      # 生产环境设为 true（禁用本地文件解析接口）
      - PRODUCTION=false
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  parser_data:
    driver: local
  parser_output:
    driver: local
